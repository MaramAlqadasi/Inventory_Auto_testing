name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # تشغيل ليلي 03:00 بتوقيت الرياض (00:00 UTC) — يكشف انتهاء الجلسة/تغيّر الواجهة قبل بداية يوم العمل.
  schedule:
    - cron: '0 0 * * *'
  # تشغيل يدوي من تبويب Actions مع فلتر اختياري (مثال: @smoke أو اسم اختبار).
  workflow_dispatch:
    inputs:
      grep:
        description: 'فلتر --grep (اتركيه فارغاً لتشغيل كل الاختبارات)'
        required: false
        default: ''

# البيئة المستهدفة حيّة خلف WAF حسّاس للمعدّل: لا نسمح بأكثر من جولة واحدة في نفس الوقت
# (كل جولة تسجّل دخولاً جديداً، والتوازي أطلق حجب IP سابقاً). الجولات تنتظر ولا تُلغى.
concurrency:
  group: playwright-live-env
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CI: true
      # الأسرار تُعرَّف في: Settings → Secrets and variables → Actions
      # BASE_URL متغيّر (Variables) لا سرّ؛ يُستعمل الافتراضي إن لم يُعرَّف.
      BASE_URL: ${{ vars.BASE_URL || 'https://smarterp.top/login' }}
      ERP_COMPANY: ${{ secrets.ERP_COMPANY }}
      ERP_USER: ${{ secrets.ERP_USER }}
      ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

    steps:
    - uses: actions/checkout@v4

    # فشل مبكّر برسالة واضحة بدل انتظار مشروع setup ليفشل بعد تثبيت المتصفّحات.
    - name: Check required secrets
      run: |
        missing=""
        [ -z "$ERP_COMPANY" ]  && missing="$missing ERP_COMPANY"
        [ -z "$ERP_USER" ]     && missing="$missing ERP_USER"
        [ -z "$ERP_PASSWORD" ] && missing="$missing ERP_PASSWORD"
        if [ -n "$missing" ]; then
          echo "::error::Missing GitHub Actions secrets:$missing — add them under Settings → Secrets and variables → Actions"
          exit 1
        fi

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    # مشروع chromium فقط (firefox/webkit معطّلان في playwright.config.js).
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # مشروع setup يعمل تلقائياً كتبعية: يسجّل الدخول مرة واحدة ويُنتج .auth/owner.json
    # (لا يُخزَّن بين الجولات عمداً — كوكي جلسة حيّة لا توضع في cache مشترك).
    - name: Run Playwright tests
      run: |
        if [ -n "${{ github.event.inputs.grep }}" ]; then
          npx playwright test --grep "${{ github.event.inputs.grep }}"
        else
          npx playwright test
        fi

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # traces/screenshots/videos عند الفشل — مدخل وكيل playwright-healer.
    - name: Upload failure evidence
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 14
